name: Build Android APK

on:
  push:
    paths:
      - 'GxnuCVaBTXTE.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q GxnuCVaBTXTE.zip -d build-project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      - name: Restore missing issued-books cache helper
        working-directory: build-project
        run: |
          cat > app/src/main/java/in/miaolibrary/app/IssuedBooksCache.kt <<'EOF'
          package in.miaolibrary.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Calendar
          import kotlin.concurrent.thread

          object IssuedBooksCache {
              private const val PREFS = "session"
              private const val CACHE_KEY = "issued_books_cache"
              private const val FETCH_DATE_KEY = "issued_books_fetch_date"
              private const val GATEWAY = "https://api.miaolibrary.in"

              fun cached(context: Context): JSONArray? {
                  val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(CACHE_KEY, null) ?: return null
                  return try { JSONArray(raw) } catch (_: Exception) { null }
              }

              fun isAfterFivePmIst(): Boolean {
                  val now = Calendar.getInstance(java.util.TimeZone.getTimeZone("Asia/Kolkata"))
                  return now.get(Calendar.HOUR_OF_DAY) >= 17
              }

              fun shouldDailyFetch(context: Context): Boolean {
                  if (!isAfterFivePmIst()) return false
                  val today = todayIst()
                  val saved = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(FETCH_DATE_KEY, null)
                  return saved != today
              }

              fun fetch(context: Context, force: Boolean, callback: (Boolean, JSONArray) -> Unit) {
                  val access = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString("access_token", null)
                  if (access.isNullOrBlank()) {
                      callback(false, cached(context) ?: JSONArray())
                      return
                  }

                  thread {
                      var connection: HttpURLConnection? = null
                      try {
                          connection = (URL("$GATEWAY/my-books").openConnection() as HttpURLConnection).apply {
                              requestMethod = "GET"
                              connectTimeout = 15000
                              readTimeout = 30000
                              setRequestProperty("Authorization", "Bearer $access")
                              setRequestProperty("Accept", "application/json")
                              setRequestProperty("Cache-Control", "no-cache")
                          }
                          val code = connection.responseCode
                          val stream = if (code in 200..299) connection.inputStream else connection.errorStream
                          val body = stream?.bufferedReader()?.use { it.readText() }.orEmpty()
                          if (code !in 200..299) {
                              callback(false, cached(context) ?: JSONArray())
                              return@thread
                          }

                          val root = JSONObject(body)
                          val books = when {
                              root.opt("books") is JSONArray -> root.optJSONArray("books")!!
                              root.opt("items") is JSONArray -> root.optJSONArray("items")!!
                              root.opt("data") is JSONArray -> root.optJSONArray("data")!!
                              else -> JSONArray()
                          }

                          context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                              .putString(CACHE_KEY, books.toString())
                              .putString(FETCH_DATE_KEY, todayIst())
                              .apply()

                          callback(true, books)
                      } catch (_: Exception) {
                          callback(false, cached(context) ?: JSONArray())
                      } finally {
                          connection?.disconnect()
                      }
                  }
              }

              fun scheduleDaily(context: Context) {
                  // The cache refresh is performed on the first app open at/after 5 PM IST.
                  // Due-date alarms are managed by DueDateNotificationScheduler.
              }

              private fun todayIst(): String {
                  val now = Calendar.getInstance(java.util.TimeZone.getTimeZone("Asia/Kolkata"))
                  return "%04d-%02d-%02d".format(
                      now.get(Calendar.YEAR),
                      now.get(Calendar.MONTH) + 1,
                      now.get(Calendar.DAY_OF_MONTH)
                  )
              }
          }
          EOF

      - name: Build debug APK
        working-directory: build-project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koha-android-debug
          path: build-project/app/build/outputs/apk/debug/*.apk

# build trigger
