<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miao Library</title>
<style>
:root{
  --bg:#F8F5EF; --surface:#FFFFFF; --ink:#1B2B3A; --muted:#69707A;
  --gold:#B78B45; --outline:#E2DED4; --danger:#9B4C4C;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
h1,h2,h3{margin:0;font-weight:600;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
.login-card{width:100%;max-width:380px;text-align:center;}
.login-card .brand{font-size:26px;font-weight:700;margin-bottom:4px;}
.login-card .tagline{color:var(--muted);font-size:14px;margin-bottom:28px;}
.field{margin-bottom:14px;text-align:left;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
.field input{width:100%;padding:12px 14px;border:1px solid var(--outline);border-radius:12px;
  font-size:15px;background:var(--surface);color:var(--ink);}
.field input:focus{outline:2px solid var(--ink);outline-offset:1px;}
.btn{display:block;width:100%;padding:13px 16px;border-radius:12px;border:none;font-size:15px;font-weight:600;}
.btn-primary{background:var(--ink);color:#fff;margin-top:6px;}
.btn-outline{background:var(--surface);color:var(--ink);border:1px solid var(--ink);}
.btn:disabled{opacity:.6;}
.error{color:var(--danger);font-size:13.5px;min-height:18px;margin-top:10px;}

/* ---------- app shell ---------- */
#app header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);
  border-bottom:1px solid var(--outline);position:sticky;top:0;z-index:5;}
header .logo{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
header .titles{flex:1;min-width:0;}
header .titles h1{font-size:17px;}
header .titles p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
header .btn{width:auto;padding:8px 14px;font-size:13px;}

main{max-width:1200px;margin:0 auto;padding:18px 16px 90px;}
.sections{display:block;}
.section{display:none;}
.section.active{display:block;}
.section{min-width:0;}
.section h2{font-size:19px;margin-bottom:12px;}

.card{background:var(--surface);border:1px solid var(--outline);border-radius:16px;
  padding:14px 16px;margin-bottom:12px;overflow-wrap:anywhere;}
.card.clickable{cursor:pointer;transition:box-shadow .12s ease;}
.card.clickable:hover{box-shadow:0 2px 10px rgba(27,43,58,.08);}
.card.outlined{border:2px solid var(--ink);}
.card .title{font-weight:600;font-size:15.5px;margin-bottom:2px;}
.card .row{font-size:13.5px;color:var(--muted);margin-top:3px;}
.card .row.emph{color:var(--ink);font-weight:700;font-size:14px;}
.loading-row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:6px 2px;}
.spinner{width:16px;height:16px;border:2px solid var(--outline);border-top-color:var(--ink);
  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* home */
.id-card{display:flex;gap:16px;align-items:flex-start;}
.id-photo{width:84px;height:108px;border-radius:12px;background:#EEEBE5;object-fit:cover;flex-shrink:0;}
.id-info .name{font-weight:700;font-size:17px;margin-bottom:4px;}
.id-info .row{font-size:13px;color:var(--muted);margin-top:2px;}

/* catalogue */
.search-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.search-row input{flex:1;min-width:120px;padding:12px 14px;border:1px solid var(--outline);border-radius:12px;
  font-size:15px;background:var(--surface);color:var(--ink);}
.search-row input:focus{outline:2px solid var(--ink);outline-offset:1px;}
.search-row .btn{width:100%;white-space:normal;}

/* history toggle button spacing */
#history-btn{margin:4px 0 14px;}

/* bottom nav (mobile only) */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--surface);
  border-top:1px solid var(--outline);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  gap:4px;z-index:5;}
.bottom-nav button{flex:1;background:none;border:none;padding:8px 2px;border-radius:12px;
  font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;}
.bottom-nav button .dot{width:8px;height:8px;border-radius:50%;background:transparent;}
.bottom-nav button.selected{color:var(--ink);font-weight:700;background:#EEE8DC;}

/* modal */
.modal{position:fixed;inset:0;background:rgba(27,43,58,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;}
.modal-panel{background:var(--surface);width:100%;max-width:560px;max-height:80vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:20px;}
@media(min-width:640px){.modal{align-items:center;}.modal-panel{border-radius:20px;}}
.modal-panel h3{font-size:18px;margin-bottom:12px;}
.modal-close{width:auto;padding:8px 16px;font-size:13px;margin-top:8px;}

/* desktop: all four sections side by side */
@media(min-width:900px){
  .sections{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start;}
  .section{display:block;min-width:0;max-height:calc(100vh - 140px);overflow:auto;}
  .bottom-nav{display:none;}
  main{padding-bottom:24px;}
}
@media(max-width:899px){
  .bottom-nav{display:flex;}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand">Miao Library</div>
    <div class="tagline">Your library, wherever you are</div>
    <div class="field"><label for="li-user">Library username</label><input id="li-user" type="text" autocomplete="username"></div>
    <div class="field"><label for="li-pass">Password</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="li-btn">Sign in</button>
    <div class="error" id="li-err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo">M</div>
    <div class="titles"><h1>Miao Library</h1><p>Welcome back, <span id="welcome-name">Patron</span></p></div>
    <button class="btn btn-outline" id="logout-top">Sign out</button>
  </header>
  <main>
    <div class="sections">

      <section class="section active" id="sec-home">
        <h2>Home</h2>
        <div class="card" id="id-card-box">
          <div class="id-card">
            <img class="id-photo" id="id-photo" alt="Member photo">
            <div class="id-info">
              <div class="name" id="id-name">—</div>
              <div class="row" id="id-cardno"></div>
              <div class="row" id="id-email"></div>
              <div class="row" id="id-expiry"></div>
              <div class="row" id="id-status"></div>
            </div>
          </div>
        </div>
        <div id="announcements-wrap" class="hidden">
          <h2 style="margin-top:20px;">Announcements</h2>
          <div id="announcements-list"></div>
        </div>
      </section>

      <section class="section" id="sec-catalogue">
        <h2>Catalogue</h2>
        <div class="search-row">
          <input id="cat-input" type="text" placeholder="Search books, authors or subjects">
          <button class="btn btn-primary" id="cat-search-btn">Search catalogue</button>
        </div>
        <div id="cat-results"></div>
      </section>

      <section class="section" id="sec-books">
        <h2>My Books</h2>
        <div id="books-current"></div>
        <button class="btn btn-primary" id="history-btn">Load issue history / previous issues</button>
        <div id="books-history"></div>
      </section>

      <section class="section" id="sec-account">
        <h2>Account</h2>
        <div class="card">
          <div class="row">Signed in as <strong id="acc-username">—</strong></div>
        </div>
        <button class="btn btn-outline" id="logout-btn-2">Log out</button>
      </section>

    </div>
  </main>
  <nav class="bottom-nav">
    <button data-target="home" class="selected"><span>Home</span></button>
    <button data-target="catalogue"><span>Catalogue</span></button>
    <button data-target="books"><span>My Books</span></button>
    <button data-target="account"><span>Account</span></button>
  </nav>
</div>

<div class="modal hidden" id="book-modal">
  <div class="modal-panel">
    <h3>Book details</h3>
    <div id="modal-body"></div>
    <button class="btn btn-outline modal-close" id="modal-close">Close</button>
  </div>
</div>

<script>
const GATEWAY='https://api.miaolibrary.in';
const CMS_TTL_MS=60*60*1000;

function lsGet(k,d=null){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function token(){return lsGet('access_token');}
function username(){return lsGet('username','Patron');}
function memberInfo(){try{return JSON.parse(lsGet('member_info','null'));}catch(e){return null;}}
function esc(s){const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}

async function apiRequest(path,method='GET',body=null,auth=null){
  const headers={'Accept':'application/json'};
  if(body)headers['Content-Type']='application/json';
  if(auth)headers['Authorization']='Bearer '+auth;
  try{
    const res=await fetch(GATEWAY+path,{method,headers,body:body?JSON.stringify(body):undefined});
    const text=await res.text();
    return {ok:res.ok,text,status:res.status};
  }catch(e){
    // fetch() throws (rather than resolving with a failed status) when the
    // request never reaches the server at all - almost always a CORS block,
    // a page served over file://, or no network connection. Surface that
    // distinction to the caller instead of collapsing it into a generic
    // "login failed", since the fix for each is completely different.
    return {ok:false,text:'',status:0,networkError:true};
  }
}

function displayValue(item,key){
  if(!item||!(key in item))return '';
  const v=item[key];
  if(v===null||v===undefined)return '';
  if(Array.isArray(v))return v.map(o=>typeof o==='object'?JSON.stringify(o):String(o)).join(', ');
  if(typeof v==='object')return '';
  return String(v).trim();
}
function first(item,...keys){for(const k of keys){const v=displayValue(item,k);if(v&&v!=='null')return v;}return '';}

function findArray(obj,depth=0){
  if(depth>4||!obj||typeof obj!=='object')return null;
  const preferred=['books','items','issues','current','current_books','history','returned_books','results','records','data'];
  for(const k of preferred){if(Array.isArray(obj[k]))return obj[k];}
  for(const k of preferred){if(obj[k]&&typeof obj[k]==='object'){const n=findArray(obj[k],depth+1);if(n&&n.length)return n;}}
  for(const k in obj){if(Array.isArray(obj[k]))return obj[k];}
  for(const k in obj){if(obj[k]&&typeof obj[k]==='object'){const n=findArray(obj[k],depth+1);if(n&&n.length)return n;}}
  return null;
}
function arrayFrom(raw,...keys){
  try{
    const trimmed=raw.trim();
    if(trimmed.startsWith('['))return JSON.parse(trimmed);
    const root=JSON.parse(trimmed);
    for(const k of keys){if(Array.isArray(root[k]))return root[k];}
    return findArray(root)||[];
  }catch(e){return [];}
}

function memberField(info,...keys){
  function find(obj,depth){
    if(depth>3||!obj||typeof obj!=='object')return '';
    for(const k of keys){const v=obj[k];if(v!==undefined&&v!==null&&typeof v!=='object'){const t=String(v).trim();if(t&&t!=='null')return t;}}
    for(const k in obj){if(obj[k]&&typeof obj[k]==='object'&&!Array.isArray(obj[k])){const r=find(obj[k],depth+1);if(r)return r;}}
    return '';
  }
  return find(info,0);
}

function isPublishedAnnouncement(item){
  const off=['false','0','no','draft','unpublished','inactive','archived','deleted'];
  if(item.published===false||item.is_published===false)return false;
  const status=(first(item,'status','publish_status','publication_status')||'').toLowerCase();
  if(off.includes(status))return false;
  return true;
}

function formatDate(value){
  const raw=(value||'').trim();
  if(!raw||raw==='null')return raw;
  const m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return raw;
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const mo=parseInt(m[2],10)-1;
  if(mo<0||mo>11)return raw;
  return `${m[3]} ${months[mo]} ${m[1]}`;
}

function cardEl(text,muted){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="row${muted?'':''}">${esc(text)}</div>`;return d;}
function loadingRow(label){const d=document.createElement('div');d.className='loading-row';d.innerHTML=`<span class="spinner"></span> ${esc(label)}`;return d;}

/* ---------- login ---------- */
async function doLogin(){
  const user=document.getElementById('li-user').value.trim();
  const pass=document.getElementById('li-pass').value;
  const btn=document.getElementById('li-btn');
  const err=document.getElementById('li-err');
  err.textContent='';
  if(!user||!pass){err.textContent='Enter your username and password.';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  const res=await apiRequest('/login','POST',{username:user,password:pass});
  btn.disabled=false;btn.textContent='Sign in';
  if(!res.ok){
    if(res.networkError){
      err.textContent=(location.protocol==='file:')
        ? 'Could not reach the library server. This page is open as a local file (file://), which browsers block from calling outside servers. Serve it over http/https instead (e.g. a local web server, or your real site).'
        : 'Could not reach the library server. This is usually a CORS restriction on the server for this page\'s address, or no network connection.';
    } else if(res.status===401||res.status===403){
      err.textContent='Login failed - check your username and password.';
    } else {
      err.textContent=`Login failed (server responded ${res.status||'with an error'}).`;
    }
    return;
  }
  try{
    const j=JSON.parse(res.text);
    const access=j.access_token||j.token;
    if(!access)throw new Error();
    lsSet('access_token',access);
    lsSet('username',user);
    showApp();
    loadMemberPhoto();
    loadAccountInfo();
  }catch(e){err.textContent='Invalid gateway response.';}
}
function logout(){
  ['access_token','username','member_info','cms_cache','cms_cache_time'].forEach(lsDel);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('li-user').value='';
  document.getElementById('li-pass').value='';
}

/* ---------- home ---------- */
async function loadAccountInfo(){
  const res=await apiRequest('/account','GET',null,token());
  if(res.ok){lsSet('member_info',res.text);renderIdCard();}
}
async function loadMemberPhoto(){
  try{
    const r=await fetch(GATEWAY+'/account/photo',{headers:{'Authorization':'Bearer '+token()}});
    if(r.ok){const blob=await r.blob();document.getElementById('id-photo').src=URL.createObjectURL(blob);}
  }catch(e){}
}
function renderIdCard(){
  const info=memberInfo()||{};
  const name=memberField(info,'name')||username();
  const card=memberField(info,'card_number');
  const email=memberField(info,'email');
  const expiry=memberField(info,'membership_expiry_date');
  const status=memberField(info,'membership_status');
  document.getElementById('id-name').textContent=name;
  document.getElementById('id-cardno').textContent=card?`Card No.: ${card}`:'';
  document.getElementById('id-email').textContent=email?`Email: ${email}`:'';
  document.getElementById('id-expiry').textContent=expiry?`Valid upto: ${formatDate(expiry)}`:'';
  document.getElementById('id-status').textContent=status?`Membership status: ${status}`:'';
  document.getElementById('welcome-name').textContent=name;
}

async function loadAnnouncements(){
  const cached=lsGet('cms_cache');
  const cachedAt=parseInt(lsGet('cms_cache_time','0'),10);
  const fresh=cached&&(Date.now()-cachedAt)<CMS_TTL_MS;
  if(fresh){renderAnnouncements(cached);return;}
  const res=await apiRequest('/cms/content','GET',null,token());
  if(!res.ok){if(cached)renderAnnouncements(cached);return;}
  lsSet('cms_cache',res.text);
  lsSet('cms_cache_time',String(Date.now()));
  renderAnnouncements(res.text);
}
function renderAnnouncements(raw){
  const wrap=document.getElementById('announcements-wrap');
  const list=document.getElementById('announcements-list');
  list.innerHTML='';
  const items=arrayFrom(raw,'items','content','announcements').filter(isPublishedAnnouncement);
  if(!items.length){wrap.classList.add('hidden');return;}
  wrap.classList.remove('hidden');
  for(const item of items){
    const title=first(item,'title','name')||'Published announcement';
    const body=first(item,'body','description','html','content');
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="title">${esc(title)}</div>`+(body?`<div class="row">${esc(body)}</div>`:'');
    list.appendChild(c);
  }
}

/* ---------- catalogue ---------- */
async function searchCatalogue(){
  const q=document.getElementById('cat-input').value.trim();
  const out=document.getElementById('cat-results');
  const btn=document.getElementById('cat-search-btn');
  btn.disabled=true;
  out.innerHTML='';out.appendChild(loadingRow('Searching catalogue…'));
  const res=await apiRequest('/catalogue/search?q='+encodeURIComponent(q),'GET',null,token());
  btn.disabled=false;out.innerHTML='';
  if(!res.ok){out.appendChild(cardEl('Catalogue unavailable.'));return;}
  const items=arrayFrom(res.text,'items','results','records','books');
  if(!items.length){out.appendChild(cardEl('No catalogue records found.'));return;}
  for(const item of items){
    const title=first(item,'title')||'Untitled';
    const author=first(item,'author');
    const library=first(item,'library');
    const avail=first(item,'availability');
    const c=document.createElement('div');c.className='card clickable';
    let html=`<div class="title">${esc(title)}</div>`;
    if(author)html+=`<div class="row">Author: ${esc(author)}</div>`;
    if(library)html+=`<div class="row">Library: ${esc(library)}</div>`;
    if(avail)html+=`<div class="row">Availability: ${esc(avail)}</div>`;
    c.innerHTML=html;
    c.addEventListener('click',()=>openBookDetails(item));
    out.appendChild(c);
  }
}
const DETAIL_FIELDS=['title','subtitle','author','authors','publisher','publication','publication_year','year',
  'isbn','isbn13','isbn10','call_number','callnumber','shelfmark','library','location','availability','status',
  'barcode','holding_count','copy_count','item_type','notes'];
async function openBookDetails(item){
  let data=item;
  const id=first(item,'biblionumber');
  if(id){
    const res=await apiRequest('/book-details/'+encodeURIComponent(id),'GET',null,token());
    if(res.ok){try{const j=JSON.parse(res.text);data=j.book||j.record||j;}catch(e){}}
  }
  const body=document.getElementById('modal-body');
  body.innerHTML='';
  let any=false;
  for(const f of DETAIL_FIELDS){
    const val=displayValue(data,f);
    if(!val)continue;
    any=true;
    const label=f.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
    const row=document.createElement('div');row.className='card';
    row.innerHTML=`<div class="row">${esc(label)}</div><div>${esc(val)}</div>`;
    body.appendChild(row);
  }
  if(!any)body.appendChild(cardEl('No further details available.'));
  document.getElementById('book-modal').classList.remove('hidden');
}

/* ---------- my books ---------- */
let currentIssueKeys=new Set();
function issueKeys(item){
  const keys=new Set();
  const add=(p,v)=>{v=(v||'').trim();if(v&&v!=='null')keys.add(p+':'+v);};
  add('issue',first(item,'issue_id','checkout_id','loan_id'));
  const barcode=first(item,'barcode','item_barcode');
  const issued=first(item,'checkout_date','date_issued','issued_date','issue_date');
  const due=first(item,'date_due','due_date','duedate','due');
  if(barcode&&issued)add('bi',barcode+'|'+issued);
  if(barcode&&due)add('bd',barcode+'|'+due);
  return keys;
}
function isCurrentIssue(item){
  if(!currentIssueKeys.size)return false;
  for(const k of issueKeys(item))if(currentIssueKeys.has(k))return true;
  return false;
}
function renderBookList(container,items,current){
  container.innerHTML='';
  const shown=items.filter(it=>current||!isCurrentIssue(it));
  if(!shown.length){container.appendChild(cardEl(current?'You have no currently issued books.':'No previous issues found.'));return;}
  for(const item of shown){
    const title=first(item,'title','name')||'Untitled';
    const rows=[];
    const author=first(item,'author');if(author)rows.push(['Author',author,false]);
    const library=first(item,'library');if(library)rows.push(['Library',library,false]);
    const issued=first(item,'checkout_date','date_issued','issued_date','issue_date');if(issued)rows.push(['Issued date',formatDate(issued),false]);
    const due=first(item,'date_due','due_date','duedate','due');if(due)rows.push(['Due date',formatDate(due),current]);
    const renewed=first(item,'date_renewed','renewed_date','renewal_date');if(renewed)rows.push(['Renewed date',formatDate(renewed),false]);
    const returned=first(item,'date_returned','returned_date','return_date');if(returned)rows.push(['Returned date',formatDate(returned),false]);
    const c=document.createElement('div');c.className='card'+(current?' outlined':'');
    let html=`<div class="title">${esc(title)}</div>`;
    for(const [label,val,emph] of rows)html+=`<div class="row${emph?' emph':''}">${esc(label)}: ${esc(val)}</div>`;
    c.innerHTML=html;
    container.appendChild(c);
  }
}
async function loadMyBooks(){
  const el=document.getElementById('books-current');
  el.innerHTML='';el.appendChild(loadingRow('Loading your issued books…'));
  const res=await apiRequest('/my-books','GET',null,token());
  el.innerHTML='';
  if(!res.ok){el.appendChild(cardEl('Unable to load your books.'));return;}
  const items=arrayFrom(res.text,'books','items','issues','current','current_books');
  currentIssueKeys=new Set();
  for(const it of items)for(const k of issueKeys(it))currentIssueKeys.add(k);
  renderBookList(el,items,true);
}
async function loadIssueHistory(){
  const btn=document.getElementById('history-btn');
  const el=document.getElementById('books-history');
  btn.disabled=true;btn.textContent='Loading…';
  el.innerHTML='';el.appendChild(loadingRow('Loading previous issues…'));
  const res=await apiRequest('/issue-history','GET',null,token());
  btn.disabled=false;btn.textContent='Load issue history / previous issues';
  el.innerHTML='';
  if(!res.ok){el.appendChild(cardEl('Unable to load issue history.'));return;}
  const items=arrayFrom(res.text,'books','items','issues','history','returned_books');
  renderBookList(el,items,false);
}

/* ---------- nav + boot ---------- */
function switchSection(target){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+target).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('selected',b.dataset.target===target));
}
function showApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('welcome-name').textContent=username();
  document.getElementById('acc-username').textContent=username();
  renderIdCard();
  switchSection('home');
  loadAnnouncements();
  loadMyBooks();
}
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('li-btn').addEventListener('click',doLogin);
  document.getElementById('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('cat-search-btn').addEventListener('click',searchCatalogue);
  document.getElementById('cat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchCatalogue();}});
  document.getElementById('history-btn').addEventListener('click',loadIssueHistory);
  document.getElementById('logout-top').addEventListener('click',logout);
  document.getElementById('logout-btn-2').addEventListener('click',logout);
  document.getElementById('modal-close').addEventListener('click',()=>document.getElementById('book-modal').classList.add('hidden'));
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>switchSection(b.dataset.target)));
  if(token()){showApp();loadMemberPhoto();loadAccountInfo();}
});
</script>
</body>
